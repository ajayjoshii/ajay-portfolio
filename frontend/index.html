<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Website Title -->
    <title>Ajay Kumar Shrestha | Full Stack Developer in Nepal</title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="Official portfolio of Ajay Kumar Shrestha, a Full Stack Developer in Nepal skilled in React, JavaScript, Tailwind CSS, Node.js, Express.js, and MongoDB. Explore projects, skills, and experience."
    />

    <!-- SEO Keywords -->
    <meta
      name="keywords"
      content="Ajay Kumar Shrestha, Ajay Shrestha, Ajay Kumar Shrestha Portfolio, Full Stack Developer Nepal, MERN Stack Developer, React Developer, JavaScript Developer"
    />

    <!-- Author and Indexing -->
    <meta name="author" content="Ajay Kumar Shrestha" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://ajayshrestha143.com.np/"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logos.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#070b14" />

    <!-- Open Graph / Social Media SEO -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Ajay Kumar Shrestha | Full Stack Developer"
    />
    <meta
      property="og:description"
      content="Explore the portfolio, skills, and projects of Ajay Kumar Shrestha, Full Stack Developer in Nepal."
    />
    <meta
      property="og:url"
      content="https://ajayshrestha143.com.np/"
    />
    <meta property="og:site_name" content="Ajay Kumar Shrestha Portfolio" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Ajay Kumar Shrestha | Full Stack Developer"
    />
    <meta
      name="twitter:description"
      content="Discover the projects and skills of Ajay Kumar Shrestha, Full Stack Developer in Nepal."
    />

    <!-- Person Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ajay Kumar Shrestha",
        "url": "https://ajayshrestha143.com.np/",
        "jobTitle": "Full Stack Developer",
        "knowsAbout": [
          "React",
          "JavaScript",
          "Tailwind CSS",
          "Node.js",
          "Express.js",
          "MongoDB"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
